name: Deploy Python Hosting Bot

on:
  push:
    branches:
      - main

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check Python syntax
        run: |
          python -m py_compile host_bot.py
          if [ -d hosted_bots ]; then
            python -m compileall -q hosted_bots
          fi

  deploy-to-vps:
    needs: syntax-check
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            cd /root/your-bot-folder
            git pull origin main
            source venv/bin/activate || true
            pip install -r requirements.txt
            pkill -f "python.*host_bot.py" || true
            nohup python3 host_bot.py > host_bot.log 2>&1 &
